name: Scrape Fatsoma Events

# Fatsoma is date discovery only. scripts/scrape-fatsoma.py writes
# events.json with Aalaap booking URLs for Wednesday classes and will not
# publish a fatsoma.com link for a Wednesday night.

on:
  schedule:
    # Every Wednesday at 22:30 BST = 21:30 UTC (summer) / 22:30 UTC (winter)
    # Running at 21:30 UTC covers both BST and GMT safely
    - cron: '30 21 * * 3'
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

permissions:
  contents: write  # needed to push events.json

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run scraper
        run: python scripts/scrape-fatsoma.py

      - name: Commit and push events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # events.json plus any page whose hard-coded booking link was rolled on
          git add events.json index.html rogue-bachata-wednesdays.html big-chill-bachata-wednesdays.html try-bachata.html join-free.html faq.html cafe-sol-event.html data.json js/rogue-events.js
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "chore: roll Wednesday to next Aalaap date (events.json + booking links) [skip ci]"
            git push
          fi
